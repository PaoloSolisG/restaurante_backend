services:

  app:
    build: .
    container_name: restaurante-app
    restart: unless-stopped
    volumes:
      - ./storage:/var/www/storage
      - ./.env:/var/www/.env
    depends_on:
      - mysql
      - redis
    networks:
      - restaurante-net

  nginx:
    image: nginx:alpine
    container_name: restaurante-nginx
    restart: unless-stopped
    ports:
      - "8100:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - restaurante-net

  mysql:
    image: mysql:8.0
    container_name: restaurante-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-restaurante_central}
    volumes:
      - restaurante-mysql-data:/var/lib/mysql
    ports:
      - "33062:3306"
    networks:
      - restaurante-net

  redis:
    image: redis:alpine
    container_name: restaurante-redis
    restart: unless-stopped
    networks:
      - restaurante-net

networks:
  restaurante-net:
    driver: bridge

volumes:
  restaurante-mysql-data:
