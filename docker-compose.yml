services:

  app:
    build: .
    container_name: restaurante-app
    restart: unless-stopped
    volumes:
      - ./storage:/var/www/storage
      - ./.env:/var/www/.env
    depends_on:
      - mysql
    networks:
      - restaurante-net

  nginx:
    image: nginx:alpine
    container_name: restaurante-nginx
    restart: unless-stopped
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - restaurante-net
      - proxy-network   # NPM alcanza este contenedor por nombre

  reverb:
    build: .
    container_name: restaurante-reverb
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080 --no-interaction
    volumes:
      - ./storage:/var/www/storage
      - ./.env:/var/www/.env
    depends_on:
      - mysql
    networks:
      - restaurante-net
      - proxy-network   # NPM alcanza este contenedor para el proxy WS

  mysql:
    image: mysql:8.0
    container_name: restaurante-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-R3staurant3#2026}
      MYSQL_DATABASE: ${DB_DATABASE:-restaurante_central}
    volumes:
      - restaurante-mysql-data:/var/lib/mysql
    networks:
      - restaurante-net

networks:
  restaurante-net:
    driver: bridge
  proxy-network:
    external: true    # red existente del NPM

volumes:
  restaurante-mysql-data:
